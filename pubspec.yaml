name: aurelle
description: "Aurelle — a premium, verification-first dating & relationship-advice ecosystem for Australia."
publish_to: "none"
version: 0.1.0+1

environment:
  # Color.withValues() and current Material 3 theming require Flutter 3.27+.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # State management + DI (Phase 14: Riverpod recommended).
  flutter_riverpod: ^2.5.1
  # Editorial serif (Fraunces) + UI sans (Inter) from the design system.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
